info:
  name: Create a new product
  type: http
  seq: 1
  tags:
    - product

http:
  method: POST
  url: '{{BASE_URL}}/product'
  body:
    type: json
    data: |-
      {
        "name": "{{$randomProductName}}",
        "supplier": 1,
        "category": 1,
        "quantityPerUnit": "{{$randomInt}}",
        "unitPrice": "{{$randomPrice}}",
        "unitsInStock": "{{$randomInt}}",
        "unitsOnOrder": "{{$randomInt}}",
        "reorderLevel": "{{$randomInt}}",
        "discontinued": false
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const body = req.getBody();

        req.setBody({
          name: bru.interpolate(body.name).substring(0, 40),
          supplier: 1,
          category: 1,
          quantityPerUnit: bru.interpolate(body.quantityPerUnit),
          unitPrice: Number(bru.interpolate(body.unitPrice)),
          unitsInStock: Number(bru.interpolate(body.unitsInStock)),
          unitsOnOrder: Number(bru.interpolate(body.unitsOnOrder)),
          reorderLevel: Number(bru.interpolate(body.reorderLevel)),
          discontinued: body.discontinued,
        });
    - type: after-response
      code: |-
        const product = res.getBody();

        bru.setVar('PRODUCT_ID', product.id);
    - type: tests
      code: |-
        test("product properties", () => {
          const payload = req.getBody();
          const product = res.getBody();

          expect(product).to.have.property('id');
          expect(product).to.have.property('name', payload.name);
          expect(product).to.have.property('supplier').to.be.an('object');
          expect(product.supplier).to.have.property('id', `${payload.supplier}`);
          expect(product).to.have.property('category').to.be.an('object');
          expect(product.category).to.have.property('id', `${payload.category}`);
          expect(product).to.have.property('quantityPerUnit', payload.quantityPerUnit);
          expect(product).to.have.property('unitPrice', payload.unitPrice);
          expect(product).to.have.property('unitsInStock', payload.unitsInStock);
          expect(product).to.have.property('unitsOnOrder', payload.unitsOnOrder);
          expect(product).to.have.property('reorderLevel', payload.reorderLevel);
          expect(product).to.have.property('discontinued', payload.discontinued);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: '201'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
