info:
  name: Create a new order detail
  type: http
  seq: 5
  tags:
    - order-detail

http:
  method: POST
  url: '{{BASE_URL}}/order/:orderId/detail'
  params:
    - name: orderId
      value: '{{ORDER_ID}}'
      type: path
  body:
    type: json
    data: |-
      {
        "product": 2,
        "unitPrice": "{{$randomPrice}}",
        "quantity": "{{$randomInt}}",
        "discount": "{{$randomInt}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const body = req.getBody();

        req.setBody({
          product: Number(body.product),
          unitPrice: Number(bru.interpolate(body.unitPrice)),
          quantity: Math.max(
            Number(bru.interpolate(body.quantity)),
            1,
          ),
          discount: (Number(bru.interpolate(body.discount)) % 4) / 4,
        });
    - type: after-response
      code: |-
        const detail = res.getBody();

        bru.setVar('ORDER_PRODUCT_ID', String(detail.productId));
    - type: tests
      code: |-
        test("order detail properties", () => {
          const payload = req.getBody();
          const detail = res.getBody();
          const orderId = req.getPathParams()[0].value;

          expect(detail).to.have.property('orderId');
          expect(String(detail.orderId)).to.equal(String(orderId));
          expect(Number(detail.productId)).to.equal(payload.product);
          expect(detail).to.have.property('product').to.be.an('object');
          expect(detail.product).to.have.property('id');
          expect(String(detail.product.id)).to.equal(String(payload.product));
          expect(detail).to.have.property('unitPrice', payload.unitPrice);
          expect(detail).to.have.property('quantity', payload.quantity);
          expect(detail).to.have.property('discount').to.be.closeTo(payload.discount, 0.0001);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: '201'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
