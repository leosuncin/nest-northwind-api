opencollection: 1.0.0

info:
  name: Northwind API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''

request:
  scripts:
    - type: tests
      code: |-
        test("response type is JSON", () => {
          expect(res.headers).to.have.property('content-type').and.contains('application/json');
        });
bundled: false
extensions:
  bruno:
    ignore:
      - 'node_modules'
      - '.git'
