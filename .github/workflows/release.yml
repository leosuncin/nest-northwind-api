name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    name: Release the new version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Semantic release
        run: |-
          npx --package=@semantic-release/changelog \
          --package=@semantic-release/git \
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_REPOSITORY || secrets.GITHUB_TOKEN }}
