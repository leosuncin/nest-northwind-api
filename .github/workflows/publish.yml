name: Publish the Docker images 🐋

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  docker-bake:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Set up Docker Buildx 🐳
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build 🏗️
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b
        with:
          push: true
          set: |
            api.tags=ttl.sh/api-${{ github.sha }}:1h
            migrations.tags=ttl.sh/migrations-${{ github.sha }}:1h

  docker-push:
    runs-on: ubuntu-latest
    needs:
      - docker-bake
    strategy:
      matrix:
        project: ['api', 'migrations']
    permissions:
      packages: write
    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Set up QEMU 🖥️
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx 🐳
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Gather metadata 📋
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: |
            ghcr.io/${{ matrix.project }}-${{ github.sha }}:1h
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to GitHub Container Registry 🔑
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build 🏗️
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b
        with:
          push: true
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}

      - name: Build and push ⚒️
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
