name: Continuous Integration

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: dist
          key: ${{ github.sha }}

      - name: Setup PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: Check formatting
        run: pnx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: |
          pnx ttsc --noEmit
          pnpm build

  unit:
    name: Unit tests
    needs: format-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E tests
    needs: format-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: E2E tests
        run: pnpm test:e2e

  migrations:
    name: Migrations
    needs: format-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
        env:
          MSSQL_SA_PASSWORD: 'A1!${{ github.run_id }}a'
          ACCEPT_EULA: 'Y'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -h -1 -t 1 -C -b -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 20s
          --health-timeout 10s
          --health-start-period 15s
          --health-retries 10
    env:
      MSSQL_PORT: '1433'
      MSSQL_DB: master
      MSSQL_USER: sa
      MSSQL_SA_PASSWORD: 'A1!${{ github.run_id }}a'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: Run migrations
        run: pnpm typeorm migration:run

      - name: Reverse migrations
        run: |
          set -euo pipefail
          COUNT=$(ls src/database/migrations/*.ts | wc -l)
          for i in $(seq 1 "$COUNT"); do
            pnpm typeorm migration:revert
          done

      - name: Run seeds
        run: |
          pnpm typeorm migration:run
          pnpm typeorm-extension seed:run

  api:
    name: API tests
    needs:
      - format-lint
      - migrations
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
        env:
          MSSQL_SA_PASSWORD: 'A1!${{ github.run_id }}a'
          ACCEPT_EULA: 'Y'
        ports:
          - '1433:1433'
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -h -1 -t 1 -C -b -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 20s
          --health-timeout 10s
          --health-start-period 15s
          --health-retries 10
    env:
      MSSQL_DB: master
      MSSQL_USER: sa
      MSSQL_SA_PASSWORD: 'A1!${{ github.run_id }}a'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: build-cache
        with:
          path: dist
          key: ${{ github.sha }}

      - name: Setup PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: Build
        if: ${{ steps.build-cache.outputs.cache-hit == 'false' }}
        run: pnpm build

      - name: Run migrations and seeders
        run: |
          pnpm typeorm migration:run
          pnpm typeorm-extension seed:run

      - name: Start the API server
        id: api
        env:
          PORT: 3000
        run: pnpm start:prod
        background: true

      - name: Wait for the API Server
        uses: iFaxity/wait-on-action@a7d13170ec542bdca4ef8ac4b15e9c6aa00a6866
        with:
          resource: http-get://0.0.0.0:3000

      - name: Run API tests
        env:
          PACTUM_REQUEST_BASE_URL: http://0.0.0.0:3000
        run: pnpm exec vitest run --project FEATURE

      - name: Stop the API server
        cancel: api
