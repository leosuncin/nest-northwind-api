name: Continuous Integration

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-ci:
    name: Format, lint & run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          ACCEPT_EULA: 'Y'
        ports:
          - '1433:1433'
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -h -1 -t 1 -C -b -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 20s
          --health-timeout 10s
          --health-start-period 15s
          --health-retries 10
    env:
      MSSQL_PORT: '1433'
      MSSQL_DB: master
      MSSQL_USER: sa
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            dist
            tsconfig.build.tsbuildinfo
          key: ${{ hashFiles('src/**/*.ts') }}

      - name: Setup environment
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: true
          cache: true
          experimental: true
        env:
          PNPM_HOME: /home/runner/.local/share/mise/pnpm
          MISE_AGE_STRICT: '0'

      - name: Run all checks
        run: hk check --all --no-fail-fast

      - name: Run migrations and seeders
        run: |
          pnpm typeorm migration:run
          pnpm typeorm-extension seed:run

      - name: Start the API server
        env:
          PORT: 3000
          NODE_ENV: production
        run: mise daemons start api

      - parallel:
          - name: Unit tests
            run: pnpm test
          - name: E2E tests
            run: pnpm test:e2e
          - name: Feature tests
            run: vitest run --project FEATURE
            env:
              PACTUM_REQUEST_BASE_URL: http://0.0.0.0:3000
          - name: API tests
            run: mise run test-api

      - name: Stop the API server
        run: mise daemons stop api

      - name: Reverse migrations
        run: |
          set -euo pipefail
          MIGRATIONS=(src/database/migrations/*.ts)
          for IDX in "${!MIGRATIONS[@]}"; do
            echo "Reverting migration: ${MIGRATIONS[-1 - $IDX]}"
            pnpm typeorm migration:revert
          done
