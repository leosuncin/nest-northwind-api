name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint:
    name: Format, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: |
          pnpm ttsc --noEmit
          pnpm build

  unit:
    name: Unit tests
    needs: format-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E tests
    needs: format-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: E2E tests
        run: pnpm test:e2e

  migrations:
    name: Migrations
    needs: format-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
        env:
          MSSQL_SA_PASSWORD: 'A1!${{ github.run_id }}a'
          ACCEPT_EULA: 'Y'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -h -1 -t 1 -C -b -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 20s
          --health-timeout 10s
          --health-start-period 15s
          --health-retries 10
    env:
      MSSQL_PORT: '1433'
      MSSQL_DB: master
      MSSQL_USER: sa
      MSSQL_SA_PASSWORD: 'A1!${{ github.run_id }}a'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PNPM
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: Run migrations
        run: pnpm typeorm migration:run

      - name: Reverse migrations
        run: |
          set -euo pipefail
          COUNT=$(ls src/database/migrations/*.ts | wc -l)
          for i in $(seq 1 "$COUNT"); do
            pnpm typeorm migration:revert
          done

      - name: Run seeds
        run: |
          pnpm typeorm migration:run
          pnpm typeorm-extension seed:run
