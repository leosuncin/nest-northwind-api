services:
  workspace:
    image: mcr.microsoft.com/devcontainers/typescript-node:4-24-trixie@sha256:0cbad76d1987fd35fd78cbc58cbe8c2aa93a8daa45411e52c6c6b63ea2dae202
    command: sleep infinity
    user: node
    volumes:
      - ..:/workspaces/nest-northwind-api:cached
    network_mode: service:sql-server
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:fc010e5c955453eabc4a24d2f304103e26176fe89796b564f039c45e77a8ebc1
    user: mssql
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_LCID: 3082
      MSSQL_ENABLE_HADR: "1"
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_DB: ${MSSQL_DB:-northwind}
      MSSQL_USER: ${MSSQL_USER:-instnwnd}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sql-server-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -h -1 -t 1 -C -b -U $${MSSQL_USER:-sa} -P $${MSSQL_PASSWORD:-MSSQL_SA_PASSWORD} -Q "SELECT name FROM sys.databases WHERE name = N'$${MSSQL_DB:-master}'"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sql-server-data:
