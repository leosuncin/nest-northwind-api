services:
  workspace:
    image: mcr.microsoft.com/devcontainers/typescript-node:5-24-trixie@sha256:fb4652b1a9bca94d31eaa4d8446176e96350a7644b4633675612ce6b2c1e2b1f
    command: sleep infinity
    user: node
    volumes:
      - ..:/workspaces/nest-northwind-api:cached
  sql-server:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1
    user: mssql
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_LCID: 3082
      MSSQL_ENABLE_HADR: '1'
      MSSQL_AGENT_ENABLED: 'true'
      MSSQL_DB: ${MSSQL_DB:-northwind}
      MSSQL_USER: ${MSSQL_USER:-instnwnd}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    network_mode: service:workspace
    volumes:
      - sql-server-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -h -1 -t 1 -C -b -U $${MSSQL_USER:-sa} -P $${MSSQL_PASSWORD:-MSSQL_SA_PASSWORD} -Q "SELECT name FROM sys.databases WHERE name = N'$${MSSQL_DB:-master}'"
      interval: 10s
      timeout: 5s
      retries: 5
  contract-flows:
    image: pactumjs/flows:latest
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:-CH4ng3_m€}
      DB_HOST: mongo
    depends_on:
      mongo:
        condition: service_healthy
    network_mode: service:workspace
    healthcheck:
      test: curl -qS --spider http://127.0.0.1:8080/api/flow/v1/health
  mongo:
    image: mongo:8.3
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"

volumes:
  sql-server-data:
  mongo-data:
