services:
  workspace:
    image: ghcr.io/bare-devcontainer/mise:trixie@sha256:32a8f8a9e24ad391d589294df0871e2b1a20a74b0daf9a55be118131ea5a8411
    command: sleep infinity
    init: true
    volumes:
      - ..:/workspaces/nest-northwind-api:cached
  sql-server:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:05644dad1266ca3d445d1e8f6d2ebb9a6a03df9a39376e0f7b48917356dca9d9
    user: mssql
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_LCID: 3082
      MSSQL_ENABLE_HADR: '1'
      MSSQL_AGENT_ENABLED: 'true'
      MSSQL_DB: ${MSSQL_DB:-northwind}
      MSSQL_USER: ${MSSQL_USER:-instnwnd}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    network_mode: service:workspace
    volumes:
      - sql-server-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -h -1 -t 1 -C -b -U $${MSSQL_USER:-sa} -P $${MSSQL_PASSWORD:-MSSQL_SA_PASSWORD} -Q "SELECT name FROM sys.databases WHERE name = N'$${MSSQL_DB:-master}'"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sql-server-data:
