[tools]
"github:tj/node-prune" = "latest"
hk = { version = "latest", postinstall = "hk install --mise" }
node = { version = "latest" }
"npm:corepack" = { version = "latest", postinstall = "corepack enable" }
opencode = "latest"

[env]
MSSQL_DB = "northwind"
MSSQL_USER = "instnwnd"
MSSQL_PASSWORD = { age = "" }
MSSQL_SA_PASSWORD = { age = "" }
_.file = ".env"
_.path = ["{{config_root}}/node_modules/.bin"]
HK_MISE = 1

[settings]
experimental = true
env_shell_expand = true
node.corepack = true

[hooks]
postinstall = { task = "pnpm-install" }

[tasks.pnpm-install]
description = "Installs dependencies with pnpm"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "mise.toml"]
outputs = ["node_modules/.pnpm/lock.yaml"]

[tasks.build-and-clean]
description = "Build the app and clean node_modules"
run = ["pnpm run build", "pnpm prune --prod", "node-prune"]
env = { NODE_ENV = "production", CI = "1" }
sources = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "tsconfig.json",
  "tsconfig.build.json",
]
outputs = ["dist/tsconfig.build.tsbuildinfo"]
