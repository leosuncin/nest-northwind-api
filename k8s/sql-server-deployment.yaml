apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: sql-server
  name: sql-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: sql-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: sql-server
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: sql-server
          image: mcr.microsoft.com/mssql/server:2025-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1433
              name: tcpsql
          env:
            - name: ACCEPT_EULA
              value: 'Y'
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_LCID
              value: '3082'
            - name: MSSQL_ENABLE_HADR
              value: '1'
            - name: MSSQL_AGENT_ENABLED
              value: 'true'
          envFrom:
            - secretRef:
                name: northwind-db
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  /opt/mssql-tools18/bin/sqlcmd \
                    -h -1 -t 1 -C -b \
                    -U "${MSSQL_USER:?}" \
                    -P "${MSSQL_PASSWORD:?}" \
                    -Q "SELECT name FROM sys.databases WHERE name = N'${MSSQL_DB:?}'"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - mountPath: /var/opt/mssql
              name: sql-server-db
      restartPolicy: Always
      volumes:
        - name: sql-server-db
          persistentVolumeClaim:
            claimName: sql-server-data
