apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: server
  name: server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: server
  template:
    metadata:
      labels:
        io.kompose.service: server
    spec:
      containers:
        - name: server
          image: ghcr.io/leosuncin/nest-northwind-api:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: northwind-db
          env:
            - name: MSSQL_HOST
              value: sql-server
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
